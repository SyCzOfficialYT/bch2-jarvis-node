services:
  bch2-node:
    build:
      context: ./node
      dockerfile: Dockerfile
    container_name: bch2-jarvis-node
    restart: unless-stopped
    environment:
      BITCOIN_DATA: /data/.bitcoincashII
      RPC_USER: ${RPC_USER:?RPC_USER is required}
      RPC_PASSWORD: ${RPC_PASSWORD:?RPC_PASSWORD is required}
    volumes:
      - bch2-data:/data/.bitcoincashII
      - holding-data:/holding
    ports:
      - "8339:8339"
    networks:
      - jarvis-net
    healthcheck:
      test: ["CMD-SHELL", "bitcoincashII-cli -datadir=/data/.bitcoincashII -rpcuser=$${RPC_USER} -rpcpassword=$${RPC_PASSWORD} getblockchaininfo >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    command: ["bitcoincashIId", "-datadir=/data/.bitcoincashII", "-printtoconsole"]

  wallet-init:
    build:
      context: ./node
      dockerfile: Dockerfile
    container_name: bch2-jarvis-wallet-init
    depends_on:
      bch2-node:
        condition: service_healthy
    environment:
      RPC_USER: ${RPC_USER:?RPC_USER is required}
      RPC_PASSWORD: ${RPC_PASSWORD:?RPC_PASSWORD is required}
      RPC_WALLET: ${RPC_WALLET:-jarvis}
    volumes:
      - bch2-data:/data/.bitcoincashII
      - holding-data:/holding
    entrypoint: ["/bin/bash", "/init-wallet.sh"]
    networks:
      - jarvis-net
    restart: "no"

  dashboard-backend:
    build:
      context: ./dashboard/backend
      dockerfile: Dockerfile
    container_name: bch2-jarvis-backend
    restart: unless-stopped
    depends_on:
      bch2-node:
        condition: service_healthy
      wallet-init:
        condition: service_completed_successfully
    environment:
      RPC_HOST: bch2-node
      RPC_PORT: 8342
      RPC_USER: ${RPC_USER:?RPC_USER is required}
      RPC_PASSWORD: ${RPC_PASSWORD:?RPC_PASSWORD is required}
      RPC_WALLET: ${RPC_WALLET:-jarvis}
      STRATUM_PROXY_URL: http://stratum-proxy:8080
    volumes:
      - holding-data:/holding:ro
      - share-data:/shares:ro
    ports:
      - "3001:3001"
    networks:
      - jarvis-net

  dashboard-frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    container_name: bch2-jarvis-frontend
    restart: unless-stopped
    depends_on:
      dashboard-backend:
        condition: service_started
    ports:
      - "3080:80"
    networks:
      - jarvis-net

  stratum-proxy:
    build:
      context: ./stratum-proxy
      dockerfile: Dockerfile
    container_name: bch2-jarvis-stratum
    restart: unless-stopped
    depends_on:
      bch2-node:
        condition: service_healthy
      wallet-init:
        condition: service_completed_successfully
    environment:
      RPC_HOST: bch2-node
      RPC_PORT: 8342
      RPC_USER: ${RPC_USER:?RPC_USER is required}
      RPC_PASSWORD: ${RPC_PASSWORD:?RPC_PASSWORD is required}
      RPC_WALLET: ${RPC_WALLET:-jarvis}
      START_DIFF: ${START_DIFF:-8192}
      STRATUM_PORT: 3333
      STATS_PORT: 8080
      JOB_REFRESH_SECONDS: ${JOB_REFRESH_SECONDS:-5}
      POOL_TAG: ${POOL_TAG:-/BCH2-JARVIS/}
    volumes:
      - holding-data:/holding:ro
      - share-data:/shares
    ports:
      - "3333:3333"
      - "8080:8080"
    networks:
      - jarvis-net

volumes:
  bch2-data:
  holding-data:
  share-data:

networks:
  jarvis-net:
    driver: bridge
