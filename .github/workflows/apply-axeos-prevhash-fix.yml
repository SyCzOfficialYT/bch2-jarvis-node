name: Apply AxeOS prevhash fix

on:
  push:
    branches:
      - fix/axeos-prevhash-wire-format

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch Stratum prevhash wire format
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          proxy = Path("stratum-proxy/proxy.py")
          s = proxy.read_text(encoding="utf-8")

          old = '''def bip34_height(height: int) -> bytes:
              if height < 0:
                  raise ValueError("negative height")
              raw = height.to_bytes(max(1, (height.bit_length() + 7) // 8), "little")
              return bytes([len(raw)]) + raw


          def load_holding() -> str:
          '''
          new = '''def bip34_height(height: int) -> bytes:
              if height < 0:
                  raise ValueError("negative height")
              raw = height.to_bytes(max(1, (height.bit_length() + 7) // 8), "little")
              return bytes([len(raw)]) + raw


          def stratum_prevhash(previous_block: str) -> str:
              """Encode a GBT prevhash for AxeOS/ESP-Miner Stratum V1.

              AxeOS consumes mining.notify prevhash by reversing each 32-bit
              word before building the header. Therefore the wire value must
              reverse the order of the 32-bit words from the node's RPC hash.
              """
              raw = bytes.fromhex(previous_block)
              if len(raw) != 32:
                  raise ValueError("previous block hash must be 32 bytes")
              return b"".join(raw[i:i + 4] for i in range(28, -1, -4)).hex()


          def header_prevhash(stratum_hash: str) -> bytes:
              """Convert the AxeOS Stratum prevhash into header byte order."""
              raw = bytes.fromhex(stratum_hash)
              if len(raw) != 32:
                  raise ValueError("stratum prevhash must be 32 bytes")
              return b"".join(raw[i:i + 4][::-1] for i in range(0, 32, 4))


          def load_holding() -> str:
          '''
          if old not in s:
              raise SystemExit("bip34 insertion point not found")
          s = s.replace(old, new, 1)

          old = '        + bytes.fromhex(j["prevhash"])\n'
          new = '        + header_prevhash(j["prevhash"])\n'
          if old not in s:
              raise SystemExit("build_header prevhash expression not found")
          s = s.replace(old, new, 1)

          old = '        "prevhash": bytes.fromhex(previous_block)[::-1].hex(), "prevhash_be": previous_block,\n'
          new = '        "prevhash": stratum_prevhash(previous_block), "prevhash_be": previous_block,\n'
          if old not in s:
              raise SystemExit("refresh_job prevhash expression not found")
          s = s.replace(old, new, 1)

          proxy.write_text(s, encoding="utf-8")
          PY

      - name: Add regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          test = Path("tests/test_stratum_primitives.py")
          s = test.read_text(encoding="utf-8")
          marker = '''def test_sha256d_known_vector():\n'''
          addition = '''def test_axeos_prevhash_wire_format_roundtrip():
              rpc_hash = "00112233445566778899aabbccddeeff102030405060708090a0b0c0d0e0f000"
              wire = module.stratum_prevhash(rpc_hash)
              expected_wire = "d0e0f00090a0b0c05060708010203040ccddeeff8899aabb4455667700112233"
              assert wire == expected_wire
              assert module.header_prevhash(wire) == bytes.fromhex(rpc_hash)[::-1]


def test_sha256d_known_vector():
'''
          if marker not in s:
              raise SystemExit("test insertion point not found")
          if "test_axeos_prevhash_wire_format_roundtrip" not in s:
              s = s.replace(marker, addition, 1)
          test.write_text(s, encoding="utf-8")
          PY

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q aiohttp pytest
          python3 -m py_compile stratum-proxy/proxy.py
          pytest -q tests/test_stratum_primitives.py

      - name: Commit and push fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-axeos-prevhash-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stratum-proxy/proxy.py tests/test_stratum_primitives.py
          git commit -m "Fix AxeOS Stratum prevhash byte order"
          git push
