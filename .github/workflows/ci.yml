name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-test:
    name: Docker Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Python tests inside Docker
        run: bash scripts/test-docker.sh

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_TO_A_LONG_RANDOM_SECRET/ci-test-secret-012345678901234567890123456789/' .env
          docker compose config --quiet

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [docker-test, compose]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_TO_A_LONG_RANDOM_SECRET/ci-test-secret-012345678901234567890123456789/' .env

      - name: Build images
        run: docker compose build --pull

  workflow-version-audit:
    name: Actions runtime audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject Node 20 references
        shell: bash
        run: |
          if grep -RniE 'node-version:?[[:space:]]*["'"']?20|NODE_OPTIONS=.*node20|node20' .github/workflows; then
            echo 'Node 20 reference detected in GitHub Actions.' >&2
            exit 1
          fi
          echo 'No Node 20 references found in workflows.'
