name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            stratum-proxy/requirements.txt
            dashboard/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement stratum-proxy/requirements.txt
          python -m pip install --requirement dashboard/backend/requirements.txt
          python -m pip install pytest

      - name: Compile Python
        run: |
          python -m py_compile \
            stratum-proxy/proxy.py \
            dashboard/backend/main.py

      - name: Run tests
        run: python -m pytest -q tests

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Docker Compose plugin
        run: |
          docker compose version

      - name: Validate Compose
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_TO_A_LONG_RANDOM_SECRET/ci-test-secret-012345678901234567890123456789/' .env
          docker compose config --quiet

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [python, compose]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_TO_A_LONG_RANDOM_SECRET/ci-test-secret-012345678901234567890123456789/' .env

      - name: Build images
        run: docker compose build --pull

  workflow-version-audit:
    name: Actions runtime audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject Node 20 references
        shell: bash
        run: |
          if grep -RniE 'node-version:?[[:space:]]*["'"']?20|NODE_OPTIONS=.*node20|node20' .github/workflows; then
            echo 'Node 20 reference detected in GitHub Actions.' >&2
            exit 1
          fi
          echo 'No Node 20 references found in workflows.'
