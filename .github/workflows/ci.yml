name: CI

on:
  push:
    branches: [main, fix/production-stratum-pool]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest aiohttp==3.12.15 fastapi==0.115.6 httpx==0.28.1
      - name: Compile Python
        run: python -m py_compile stratum-proxy/proxy.py dashboard/backend/main.py
      - name: Run tests
        run: pytest -q tests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_TO_A_LONG_RANDOM_SECRET/ci-test-secret-012345678901234567890123456789/' .env
          docker compose config
