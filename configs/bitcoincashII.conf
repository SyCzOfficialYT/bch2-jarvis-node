# Reference configuration. The running node generates runtime.conf from .env.
# Keep credentials out of this tracked file.

server=1
listen=1
port=8339
maxconnections=64
dnsseed=1
rpcport=8342
rpcbind=0.0.0.0
rpcallowip=172.16.0.0/12

dbcache=1024
maxmempool=400
mempoolexpiry=72

txindex=1
blockfilterindex=1
disablewallet=0

printtoconsole=1
logtimestamps=1
